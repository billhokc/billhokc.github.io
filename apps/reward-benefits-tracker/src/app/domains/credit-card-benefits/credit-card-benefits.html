<div class="page-container">
    <h3>{{ creditCardName() }}</h3>
    <app-annual-fee-progress
        [annualFee]="creditCardBenefits()?.annualFee ?? 0"
        [benefitsRedeemedYTD]="benefitsRedeemedYTD()"
    ></app-annual-fee-progress>
    <app-benefits-form
        [benefits]="creditCardBenefits()"
        [savedBenefits]="savedBenefits()"
        [isLoggedIn]="isLoggedIn()"
        (save)="onSave($event)"
    ></app-benefits-form>
</div>
