<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>personal-site</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script type="text/javascript">
      // Handle 404 Redirect for SPA routing on Github Pages
      (function(l) {
        if (l.search[1] === 'p') {
          var pairs = l.search.slice(1).split('&');
          var q = {};
          pairs.forEach(function(pair) {
            var keyVal = pair.split('=');
            q[keyVal[0]] = keyVal.slice(1).join('=');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + (q.p ? '/' + q.p.replace(/~and~/g, '&') : '') + (q.q ? '?' + q.q.replace(/~and~/g, '&') : '') + l.hash);
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
